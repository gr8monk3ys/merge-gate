name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

jobs:
  test:
    name: test (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --quiet ".[dev]"
      # Pure functions only. Nothing here touches the network or `gh`; the
      # live fixtures (`classify_pr.py --validate`) belong to the operator.
      - run: ruff check .
      - run: python -m pytest -q
      - run: python classify_pr.py --validate

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    # About 3 minutes. A run still going after 15 is hung.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet ".[dev]"
      # Random seeds: each run tries inputs no earlier run did.
      - run: python -m pytest -q --hypothesis-profile=release tests/test_*_props.py
