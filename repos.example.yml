# Optional operator config, read from ./repos.yml if present.
#
# `data_dir` is the paths a repo has explicitly opted into as regenerated
# artifacts (scraper output, rendered data). A PR that touches nothing outside those paths classifies as
# `data-artifact-only` and may auto-merge. Absence means DENY -- an unset
# field can never yield that shape.
#
# Keys are bare repo names (no owner); ownership comes from GATE_OWNERS.
repos:
  my-scraper:
    data_dir: ["data", "output"]

  my-app:
    # Required checks that may pass as `skipped` (path-filtered jobs). Absent:
    # a skipped required check is not green.
    may_skip: ["docs-build"]
    # Check names that ARE correctness gates though their names do not say so.
    # Without one correctness gate among the required checks, a repo with
    # auto-merge on is DRIFT and nothing merges.
    correctness_checks: ["extension"]
    # Real gate merges per rolling 24h (default MERGE_GATE_MAX_PER_DAY, 3).
    merge_gate_max_per_day: 2
    # Hold every gate merge in this repo.
    merge_gate_paused: false
    # Revert commit SHAs a human has looked at. A pause raised by a detected
    # revert of a gate merge clears only when its SHA is listed here.
    merge_gate_ack_reverts: []
    # tests-only PRs may auto-merge -- only with a CI `verify-report`
    # artifact for head and base showing more tests ran (see README).
    allow_tests_only: false
    # Every merged shape needs a verify-report at head and base: no failed
    # test at head, no stage missing from it.
    require_verify_evidence: false
    # The one workflow (by path) whose successful pull_request runs (head) and
    # base-branch push runs (base) may supply the verify-report. Required by
    # both flags above; absent means no evidence.
    verify_workflow: .github/workflows/ci.yml
